[project]
name = "carcass"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosql>=15.0",
    "loguru>=0.7.3",
    "mistralai>=3.5.0",
    "numpy>=2.5.4",
    "openai>=3.37",
    "opencv-python-headless>=5.0.0.93",
    "opentelemetry-sdk>=1.45.1",
    "pillow>=13.0.0",
    "pydantic>=2.12.4",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
    "pypdfium2>=5.14.0",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
]

[project.scripts]
ingest_pipeline = "ingest.pipeline:main"
agent_pipeline = "agent.pipeline:run"
verify_citations_corruption = "evals.verify_citations_corruption.pipeline:run"

[dependency-groups]
dev = [
    "aiohttp>=3.13.3",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.0",
    "pyright>=1.1.407",
    "ruff>=0.14.6",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "chat*", "tracing*", "conversations*", "ingest*", "agent*", "evals*"]

[tool.setuptools.package-data]
tracing = ["db/sql/*.sql"]

[tool.pytest.ini_options]
markers = [
    "expensive: calls a real model endpoint; needs OPENAI_BASE_URL, OPENAI_API_KEY and OPENAI_MODEL",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "-m",
    "not expensive",
]
asyncio_mode = "auto"
